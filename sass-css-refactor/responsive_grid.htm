 <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid - SASS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="grid-overlay">
    <div class="grid-container">
        <div class="grid-wrapper top-bar">
            <div class="grid-content top-content"></div>
        </div>

        <div class="grid-wrapper main-area">
            <div class="grid-content side-column">
                <div class="small-block"></div>
                <div class="small-block"></div>
                <div class="small-block"></div>
                <div class="small-block"></div>
            </div>

            <div class="grid-content empty-column"></div>
            <div class="grid-content empty-column"></div>
            <div class="grid-content empty-column"></div>
            <div class="grid-content empty-column"></div>
            <div class="grid-content empty-column"></div>
            <div class="grid-content empty-column"></div>

            <div class="grid-content side-column">
                <div class="large-block"></div>
            </div>
        </div>

        <div class="grid-wrapper bottom-bar">
            <div class="grid-content bottom-content"></div>
        </div>
    </div>
</div>

<div class="grid-container background-grid">
    <div class="grid-wrapper background-wrapper">
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
        <div class="grid-content background-column"></div>
    </div>
</div>

<p>Resize the browser window to see that this grid responds to resizing and uses the available space.</p>

</body>
</html>
