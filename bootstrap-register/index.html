```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- Form đăng ký -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card shadow border-0">
                    <div class="card-body p-4">

                        <h2 class="text-center text-primary mb-2">
                            Đăng Ký Tài Khoản
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Vui lòng điền đầy đủ thông tin bên dưới
                        </p>

                        <form id="registerForm">

                            <!-- Họ và tên -->
                            <div class="mb-3">
                                <label for="fullname" class="form-label">
                                    Họ và tên
                                </label>
                                <input type="text" class="form-control"
                                    id="fullname" name="fullname"
                                    placeholder="Nhập họ và tên" required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>
                                <input type="email" class="form-control"
                                    id="email" name="email"
                                    placeholder="example@gmail.com" required>
                            </div>

                            <!-- Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Mật khẩu
                                </label>
                                <input type="password" class="form-control"
                                    id="password" name="password"
                                    placeholder="Nhập mật khẩu" minlength="6" required>
                            </div>

                            <!-- Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    Xác nhận mật khẩu
                                </label>
                                <input type="password" class="form-control"
                                    id="confirmPassword" name="confirmPassword"
                                    placeholder="Nhập lại mật khẩu" required>
                                <div id="passwordMessage" class="form-text"></div>
                            </div>

                            <!-- Giới tính -->
                            <div class="mb-3">
                                <label class="form-label d-block">
                                    Giới tính
                                </label>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                        type="radio" name="gender"
                                        id="male" value="Nam" required>
                                    <label class="form-check-label" for="male">
                                        Nam
                                    </label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                        type="radio" name="gender"
                                        id="female" value="Nữ">
                                    <label class="form-check-label" for="female">
                                        Nữ
                                    </label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                        type="radio" name="gender"
                                        id="other" value="Khác">
                                    <label class="form-check-label" for="other">
                                        Khác
                                    </label>
                                </div>
                            </div>

                            <!-- Sở thích -->
                            <div class="mb-3">
                                <label class="form-label d-block">
                                    Sở thích
                                </label>

                                <div class="form-check">
                                    <input class="form-check-input"
                                        type="checkbox" name="hobby"
                                        id="music" value="Âm nhạc">
                                    <label class="form-check-label" for="music">
                                        Âm nhạc
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                        type="checkbox" name="hobby"
                                        id="sports" value="Thể thao">
                                    <label class="form-check-label" for="sports">
                                        Thể thao
                                    </label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                        type="checkbox" name="hobby"
                                        id="travel" value="Du lịch">
                                    <label class="form-check-label" for="travel">
                                        Du lịch
                                    </label>
                                </div>
                            </div>

                            <!-- Quốc gia -->
                            <div class="mb-4">
                                <label for="country" class="form-label">
                                    Quốc gia
                                </label>

                                <select class="form-select" id="country"
                                    name="country" required>
                                    <option value="">-- Chọn quốc gia --</option>
                                    <option value="Việt Nam">Việt Nam</option>
                                    <option value="Nhật Bản">Nhật Bản</option>
                                    <option value="Hàn Quốc">Hàn Quốc</option>
                                    <option value="Hoa Kỳ">Hoa Kỳ</option>
                                    <option value="Thái Lan">Thái Lan</option>
                                </select>
                            </div>

                            <!-- Nút đăng ký -->
                            <button type="submit" class="btn btn-primary w-100">
                                Đăng Ký
                            </button>

                            <p class="text-center text-muted mt-3 mb-0">
                                Đã có tài khoản?
                                <a href="#">Đăng nhập</a>
                            </p>

                        </form>
                    </div>
                </div>

                <p class="text-center text-muted mt-3">
                    &copy; 2026 - Trang đăng ký Bootstrap
                </p>

            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const message = document.getElementById("passwordMessage");

        confirmPassword.addEventListener("input", function () {
            if (confirmPassword.value === "") {
                message.textContent = "";
            } else if (password.value === confirmPassword.value) {
                message.textContent = "Mật khẩu khớp.";
                message.className = "form-text text-success";
            } else {
                message.textContent = "Mật khẩu chưa khớp.";
                message.className = "form-text text-danger";
            }
        });

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (password.value !== confirmPassword.value) {
                alert("Mật khẩu xác nhận không khớp!");
                confirmPassword.focus();
                return;
            }

            alert("Đăng ký thành công! Đây là bản thực hành giao diện.");
            form.reset();
            message.textContent = "";
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
