<!DOCTYPE html>
<html lang="vi">
<head>

    <title>SASS Variables và Mixins</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container">
        <h1>Tối ưu CSS bằng SASS</h1>

        <section class="card">
            <h2>SASS Variables</h2>
            <p>
                Biến giúp quản lý màu sắc, kích thước chữ,
